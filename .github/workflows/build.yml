name: build-apk

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write      # 发布 release 需要写权限

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # runner 自带 Android SDK，不走 setup-android（它装已废弃的 tools 包会失败）
      - name: Inspect Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "(no platforms)"
          ls "$ANDROID_HOME/build-tools" 2>/dev/null || echo "(no build-tools)"

      - name: Ensure SDK 36 present
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          echo "sdkmanager=$SDKM"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          "$SDKM" "platforms;android-36" "build-tools;36.0.0" 2>&1 | tail -5 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK（self + friend 两个版本）
        run: gradle :app:assembleSelfDebug :app:assembleFriendDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mags-glass-debug
          path: app/build/outputs/apk/*/debug/*.apk

      # 每次构建都把 APK 挂到 latest release，手机/网页上点一下就能下，
      # 不用再去 Actions 页面翻 Artifacts（那里 90 天会过期，手机端也不好找）
      - name: Publish to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "latest build"
          make_latest: true
          files: app/build/outputs/apk/*/debug/*.apk
